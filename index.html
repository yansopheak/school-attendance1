<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធវត្តមានឌីជីថល - សាលាបឋមសិក្សាទួលលៀប</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&family=Moul&display=swap" rel="stylesheet">
    <style>
        :root { --royal: #1a2a6c; --gold: #d4af37; }
        body { 
            font-family: 'Kantumruy Pro', sans-serif; margin: 0;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        .app-container {
            width: 90%; max-width: 420px; background: white;
            height: 85vh; border-radius: 45px; border: 5px solid var(--gold);
            display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        }
        .header { background: var(--royal); padding: 35px 15px; text-align: center; border-bottom: 4px solid var(--gold); }
        .header h1 { font-family: 'Moul'; font-size: 18px; margin: 0; color: #f1c40f; }
        
        /* បន្ថែម Texture ត្រឡប់មកវិញ */
        .content { 
            flex: 1; padding: 20px; overflow-y: auto; 
            background-color: #ffffff;
            background-image: url('https://www.transparenttextures.com/patterns/white-diamond.png'); 
        }

        .staff-card {
            background: white; border-radius: 18px; padding: 12px; margin-bottom: 12px;
            display: flex; align-items: center; border: 2px solid #eee; border-left: 8px solid var(--royal);
            cursor: pointer; transition: 0.3s;
        }
        .staff-card:hover { transform: scale(1.02); border-color: var(--gold); }
        .avatar {
            width: 55px; height: 55px; border-radius: 15px; background: var(--royal);
            margin-right: 15px; overflow: hidden; display: flex; justify-content: center; align-items: center;
            color: var(--gold); border: 1px solid var(--gold); flex-shrink: 0;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .info .name { font-weight: bold; color: var(--royal); font-size: 15px; }
        .info .role { font-size: 11px; color: #666; background: #f0f0f0; padding: 2px 10px; border-radius: 10px; display: inline-block; }

        #status-message {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            padding: 15px 25px; border-radius: 30px; display: none; z-index: 100;
            font-weight: bold; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>សាលាបឋមសិក្សាទួលលៀប</h1>
        <p style="color:white; font-size:10px; margin-top:5px; letter-spacing:2px;">SMART ATTENDANCE</p>
    </div>
    <div class="content" id="staff-display"></div>
</div>

<div id="status-message"></div>

<script>
    // Link ទៅកាន់ Google Sheet របស់លោកគ្រូ
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzUBwkXT5pRfJfmwzi2_nCH7ndOxKYZ153j5A2ftcWCJ78awQu7Zdio8XuKZ7MFiWZE/exec";
    const SCHOOL_LOC = { lat: 12.698815661413427, lon: 103.74990933657654 };

    const staffData = [
        { name: "គុំ សុខាន", role: "នាយក", driveId: "1_f1XQBBK1WpeQPdZRgTLjrGW51TkVEi-" },
        { name: "សូ ធីម", role: "នាយករង", driveId: "" },
        { name: "យ៉ាន សុភ័ក្រ្ត", role: "លេខាធិការ", driveId: "" },
        { name: "សំ ស្រីល័ក្ខណ៍", role: "បណ្ណារក្ស", driveId: "" },
        { name: "មែ រុំ", role: "គ្រូក្រៅប្រព័ន្ធ", driveId: "" },
        { name: "កូយ សៅឃី", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "គុច គួយ", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "ផុន នារតី", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "រស់ ស្រីណា", role: "គ្រូមត្តេយ្យ", driveId: "" },
        { name: "លីវ គីម", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "សាត សៅនឿន", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "សុំ ណារីន", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "ឡូ សេងទ្រី", role: "គ្រូមត្តេយ្យ", driveId: "" },
        { name: "សូសុជាតា", role: "គ្រូកិច្ចសន្យា", driveId: "" },
        { name: "ជឿង សំភស្ស", role: "គ្រូកិច្ចសន្យា", driveId: "" },
        { name: "ឈាវ សុខគុណ", role: "គ្រូកិច្ចសន្យា", driveId: "" },
        { name: "ទ្រី មុនី", role: "គ្រូកិច្ចសន្យា", driveId: "" }
    ];

    const container = document.getElementById('staff-display');

    staffData.forEach(staff => {
        const initial = staff.name.split(' ').pop().charAt(0);
        const card = document.createElement('div');
        card.className = 'staff-card';
        card.onclick = () => handleCheckIn(staff.name);
        
        const photo = staff.driveId 
            ? `<img src="https://lh3.googleusercontent.com/d/${staff.driveId}">` 
            : `<span>${initial}</span>`;

        card.innerHTML = `
            <div class="avatar">${photo}</div>
            <div class="info">
                <div class="name">${staff.name}</div>
                <div class="role">${staff.role}</div>
            </div>
        `;
        container.appendChild(card);
    });

    function handleCheckIn(name) {
        const msg = document.getElementById('status-message');
        msg.style.display = "block";
        msg.style.background = "#fff";
        msg.style.color = "#333";
        msg.innerHTML = "⏳ កំពុងពិនិត្យទីតាំង...";

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                const dist = getDistance(pos.coords.latitude, pos.coords.longitude, SCHOOL_LOC.lat, SCHOOL_LOC.lon);
                if (dist <= 150) { // បើកចម្ងាយឱ្យ ១៥០ម៉ែត្រ ដើម្បីងាយស្រួលចុះ
                    msg.style.background = "#27ae60";
                    msg.style.color = "white";
                    msg.innerHTML = "✅ ក្នុងសាលា! កំពុងបញ្ជូនទិន្នន័យ...";
                    sendToSheet(name, pos.coords.latitude, pos.coords.longitude);
                } else {
                    msg.style.background = "#e74c3c";
                    msg.style.color = "white";
                    msg.innerHTML = `❌ អ្នកនៅឆ្ងាយពេក (${Math.round(dist)}ម)`;
                }
            }, () => alert("សូមបើក GPS លើទូរស័ព្ទ!"), { enableHighAccuracy: true });
        }
    }

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const p1 = lat1 * Math.PI/180; const p2 = lat2 * Math.PI/180;
        const dp = (lat2-lat1) * Math.PI/180; const dl = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function sendToSheet(name, lat, lon) {
        fetch(WEB_APP_URL, { 
            method: "POST", 
            mode: "no-cors", 
            body: JSON.stringify({ id: name, latitude: lat, longitude: lon }) 
        })
        .then(() => {
            alert("ជោគជ័យ! បានចុះវត្តមានសម្រាប់៖ " + name);
            location.reload();
        });
    }
</script>
</body>
</html>
