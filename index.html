<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធវត្តមានឌីជីថល - សាលាបឋមសិក្សាទួលលៀប</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&family=Moul&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-blue: #1e3799;
            --light-blue: #a29bfe;
            --gold: #f6b93b;
            --text-dark: #2d3436;
        }

        body { 
            font-family: 'Kantumruy Pro', sans-serif; 
            margin: 0;
            background: linear-gradient(135deg, #a29bfe 0%, #aed9e0 100%);
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            padding: 20px 15px;
            position: relative;
        }

        /* ថែម Texture បែបឌីជីថលនៅផ្ទៃក្រោយ */
        body::before {
            content: "";
            position: absolute; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/cubes.png');
            opacity: 0.3; z-index: -1;
        }

        .app-container {
            width: 100%; max-width: 430px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);
            overflow: hidden;
            height: 88vh;
            display: flex; flex-direction: column;
            border: 4px solid rgba(255,255,255,0.2);
        }

        .header {
            background: var(--main-blue);
            padding: 35px 20px;
            color: white;
            text-align: center;
            border-bottom-left-radius: 45px;
            border-bottom-right-radius: 45px;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* ថែមភ្ញី Dashboard ពណ៌ទឹកមាស */
        .header::after {
            content: ""; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            width: 50px; height: 5px; background: var(--gold); border-radius: 10px;
            box-shadow: 0 2px 4px rgba(246, 185, 59, 0.5);
        }

        .header h1 { 
            font-family: 'Moul', cursive; font-size: 19px; margin: 0; 
            color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            line-height: 1.6;
        }

        .header p { 
            margin: 8px 0 0; font-size: 11px; opacity: 0.8;
            letter-spacing: 2px; font-weight: bold; text-transform: uppercase;
        }

        .content { 
            padding: 30px 15px; flex: 1; overflow-y: auto; 
            position: relative;
        }
        
        /* ថែមភ្ញីឌីជីថលនៅខាងក្រោយបញ្ជីឈ្មោះ */
        .content::before {
            content: ""; position: absolute; top: 0; right: 0; width: 100px; height: 100px;
            background-image: url('https://www.transparenttextures.com/patterns/triangles-up.png');
            opacity: 0.1; z-index: -1;
        }

        .staff-list { display: flex; flex-direction: column; gap: 15px; }

        .staff-btn {
            background: white;
            padding: 15px 18px;
            border-radius: 25px;
            display: flex; align-items: center;
            cursor: pointer; transition: all 0.3s;
            width: 100%; text-align: left;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            /* ថែមស៊ុមជុំវិញឈ្មោះបុគ្គលិកពណ៌ទឹកមាស */
            border: 2px solid var(--gold);
        }

        .staff-btn:hover {
            transform: translateY(-4px);
            border-color: var(--main-blue);
            box-shadow: 0 10px 25px rgba(30, 55, 153, 0.1);
        }

        .avatar-frame {
            width: 50px; height: 50px; border-radius: 18px;
            background: linear-gradient(135deg, var(--light-blue), var(--main-blue));
            display: flex; justify-content: center; align-items: center;
            margin-right: 18px; font-size: 20px; color: white;
            box-shadow: 0 4px 8px rgba(108, 92, 231, 0.3);
        }

        .avatar-frame img { width: 100%; height: 100%; object-fit: cover; }

        .info { flex: 1; }
        .name { font-weight: 700; color: var(--text-dark); font-size: 16px; margin-bottom: 2px; }
        .role { 
            font-size: 12px; color: var(--main-blue); 
            background: rgba(30, 55, 153, 0.08);
            padding: 2px 10px; border-radius: 15px; display: inline-block;
            font-weight: bold;
        }

        #status-bar {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 80%; padding: 18px; border-radius: 25px;
            backdrop-filter: blur(15px); display: none; text-align: center;
            font-weight: bold; z-index: 100; font-size: 14px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div id="gps-modal"></div>

<div class="app-container">
    <div class="header">
        <h1>សាលាបឋមសិក្សាទួលលៀប</h1>
        <p>SMART ATTENDANCE SYSTEM</p>
    </div>

    <div class="content">
        <div class="staff-list" id="staff-container">
            </div>
    </div>
</div>

<div id="status-bar"></div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzUBwkXT5pRfJfmwzi2_nCH7ndOxKYZ153j5A2ftcWCJ78awQu7Zdio8XuKZ7MFiWZE/exec";
    const SHOOL_LOC = { lat: 12.698815661413427, lon: 103.74990933657654 };

    const staffData = [
        { name: "គុំ សុខាន", role: "នាយក", driveId: "" },
        { name: "សូ ធីម", role: "នាយករង", driveId: "" },
        { name: "យ៉ាន សុភ័ក្រ្ត", role: "លេខាធិការ", driveId: "" },
        { name: "សំ ស្រីល័ក្ខណ៍", role: "បណ្ណារក្ស", driveId: "" },
        { name: "មែ រុំ", role: "គ្រូក្រៅប្រព័ន្ធ", driveId: "" },
        { name: "កូយ សៅឃី", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "គុច គួយ", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "ផុន នារតី", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "រស់ ស្រីណា", role: "គ្រូមត្តេយ្យ", driveId: "" },
        { name: "លីវ គីម", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "សាត សៅនឿន", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "សុំ ណារីន", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "ឡូ សេងទ្រី", role: "គ្រូមត្តេយ្យ", driveId: "" },
        { name: "សូសុជាតា", role: "គ្រូកិច្ចសន្យា", driveId: "" },
        { name: "ជឿង សំភស្ស", role: "គ្រូកិច្ចសន្យា", driveId: "" },
        { name: "ឈាវ សុខគុណ", role: "គ្រូកិច្ចសន្យា", driveId: "" },
        { name: "ទ្រី មុនី", role: "គ្រូកិច្ចសន្យា", driveId: "" }
    ];

    const container = document.getElementById('staff-container');

    staffData.forEach(staff => {
        const initial = staff.name.split(' ').pop().charAt(0);
        const card = document.createElement('button');
        card.className = 'staff-btn';
        card.onclick = () => processCheckIn(staff.name);
        
        const photoContent = staff.driveId 
            ? `<img src="http://googleusercontent.com/profile/picture/7{staff.driveId}">` 
            : `<span>${initial}</span>`;

        card.innerHTML = `
            <div class="avatar-frame">${photoContent}</div>
            <div class="info">
                <div class="name">${staff.name}</div>
                <div class="role">${staff.role}</div>
            </div>
        `;
        container.appendChild(card);
    });

    function processCheckIn(name) {
        const area = document.getElementById('status-bar');
        area.style.display = "block";
        area.style.background = "white";
        area.style.color = var(--text-dark);
        area.innerHTML = `⏳ កំពុងផ្ទៀងផ្ទាត់ទីតាំងរបស់ ${name}...`;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                const dist = calcDist(pos.coords.latitude, pos.coords.longitude, SHOOL_LOC.lat, SHOOL_LOC.lon);
                if (dist <= 100) {
                    area.style.background = "#20bf6b";
                    area.style.color = "white";
                    area.innerHTML = "🚀 ទីតាំងត្រឹមត្រូវ! កំពុងបញ្ជូន...";
                    sendToSheets(name, pos.coords.latitude, pos.coords.longitude);
                } else {
                    area.style.background = "#eb3b5a";
                    area.style.color = "white";
                    area.innerHTML = `❌ បដិសេធ! នៅឆ្ងាយសាលា ${Math.round(dist)}ម`;
                }
            }, () => alert("សូមបើក GPS!"), { enableHighAccuracy: true });
        }
    }

    function calcDist(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const p1 = lat1 * Math.PI/180; const p2 = lat2 * Math.PI/180;
        const dp = (lat2-lat1) * Math.PI/180; const dl = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function sendToSheets(name, lat, lon) {
        fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ id: name, latitude: lat, longitude: lon }) })
        .then(() => {
            alert("✅ រួចរាល់! អរគុណ " + name);
            location.reload();
        });
    }
</script>
</body>
</html>
