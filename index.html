<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធវត្តមានឌីជីថល - សាលាបឋមសិក្សាទួលលៀប</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&family=Moul&display=swap" rel="stylesheet">
    <style>
        :root { 
            --blue-royal: #1a2a6c; 
            --blue-light: #48c9b0; /* ពណ៌ខៀវស្រាលសម្រាប់ស៊ុម */
            --blue-hover: #1abc9c; /* ពណ៌ខៀវដិតពេល Hover */
            --bg-glass: rgba(255, 255, 255, 0.95);
        }
        
        body { 
            font-family: 'Kantumruy Pro', sans-serif; margin: 0;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
        }

        .app-container {
            width: 95%; max-width: 400px; height: 90vh; background: var(--bg-glass);
            border-radius: 40px; border: 4px solid white;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5); backdrop-filter: blur(10px);
        }

        .header { background: var(--blue-royal); padding: 30px 15px; text-align: center; border-bottom: 4px solid white; }
        .header h1 { font-family: 'Moul'; font-size: 19px; margin: 0; color: #fff; }
        .header p { color: #f1c40f; font-size: 10px; margin-top: 8px; letter-spacing: 2px; font-weight: bold; }

        .content { 
            flex: 1; padding: 20px 15px; overflow-y: auto; 
            background-image: url('https://www.transparenttextures.com/patterns/white-diamond.png'); /* Texture ពេជ្រ */
        }

        /* --- ផ្នែក Card ដែលលោកគ្រូចង់បានឱ្យតូច និងមានពណ៌ខៀវ --- */
        .staff-card {
            background: white; border-radius: 18px; padding: 12px; margin-bottom: 12px;
            display: flex; align-items: center; 
            /* បន្ថែមស៊ុមពណ៌ខៀវស្តើងៗ */
            border: 2px solid var(--blue-light);
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        /* ចលនាពេលយកដៃប៉ះ (Touch) ឬ Hover */
        .staff-card:hover {
            transform: translateY(-5px);
            /* ប្តូរពណ៌ស៊ុមពេល Hover */
            border-color: var(--blue-hover);
            box-shadow: 0 10px 25px rgba(26, 188, 156, 0.3);
        }

        .avatar {
            width: 55px; height: 55px; border-radius: 12px; background: #eee;
            margin-right: 15px; overflow: hidden; display: flex; 
            justify-content: center; align-items: center;
            border: 1px solid #ddd;
        }

        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar span { color: var(--blue-royal); font-weight: bold; font-size: 20px; }

        .info { flex: 1; }
        .name { font-weight: 700; color: var(--blue-royal); font-size: 16px; margin-bottom: 3px; }
        .role { font-size: 11px; color: #7f8c8d; background: #f0f3f6; padding: 2px 8px; border-radius: 10px; }

        #status-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 80%; padding: 15px; border-radius: 30px; display: none; 
            text-align: center; font-weight: bold; z-index: 2000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<div id="status-bar"></div>

<div class="app-container">
    <div class="header">
        <h1>សាលាបឋមសិក្សាទួលលៀប</h1>
        <p>DIGITAL ATTENDANCE SYSTEM</p>
    </div>
    <div class="content" id="list-container"></div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzUBwkXT5pRfJfmwzi2_nCH7ndOxKYZ153j5A2ftcWCJ78awQu7Zdio8XuKZ7MFiWZE/exec";
    const SCHOOL_LOC = { lat: 12.6988, lon: 103.7499 };

    const staffData = [
        { name: "គុំ សុខាន", role: "នាយក", driveId: "1_f1XQBBK1WpeQPdZRgTLjrGW51TkVEi-" },
        { name: "សូ ធីម", role: "នាយករង", driveId: "" },
        { name: "យ៉ាន សុភ័ក្រ្ត", role: "លេខាធិការ", driveId: "" },
        { name: "សំ ស្រីល័ក្ខណ៍", role: "បណ្ណារក្ស", driveId: "" },
        { name: "មែ រុំ", role: "គ្រូក្រៅប្រព័ន្ធ", driveId: "" },
        { name: "កូយ សៅឃី", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "គុច គួយ", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "ផុន នារតី", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "រស់ ស្រីណា", role: "គ្រូមត្តេយ្យ", driveId: "" },
        { name: "លីវ គីម", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "សាត សៅនឿន", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "សុំ ណារីន", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "ឡូ សេងទ្រី", role: "គ្រូមត្តេយ្យ", driveId: "" },
        { name: "សូសុជាតា", role: "គ្រូកិច្ចសន្យា", driveId: "" },
        { name: "ជឿង សំភស្ស", role: "គ្រូកិច្ចសន្យា", driveId: "" },
        { name: "ឈាវ សុខគុណ", role: "គ្រូកិច្ចសន្យា", driveId: "" },
        { name: "ទ្រី មុនី", role: "គ្រូកិច្ចសន្យា", driveId: "" }
    ];

    const container = document.getElementById('list-container');

    staffData.forEach(s => {
        const card = document.createElement('div');
        card.className = 'staff-card';
        card.onclick = () => startAttendance(s.name);
        
        const photoHtml = s.driveId 
            ? `<img src="https://lh3.googleusercontent.com/d/${s.driveId}">` 
            : `<span>${s.name.charAt(0)}</span>`;

        card.innerHTML = `
            <div class="avatar">${photoHtml}</div>
            <div class="info">
                <div class="name">${s.name}</div>
                <div class="role">${s.role}</div>
            </div>
        `;
        container.appendChild(card);
    });

    function startAttendance(name) {
        const bar = document.getElementById('status-bar');
        bar.style.display = "block";
        bar.style.background = "white";
        bar.style.color = "#333";
        bar.innerHTML = "⏳ កំពុងពិនិត្យទីតាំង GPS...";

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                const dist = calculateDist(pos.coords.latitude, pos.coords.longitude, SCHOOL_LOC.lat, SCHOOL_LOC.lon);
                if (dist <= 300) { 
                    bar.style.background = "#27ae60";
                    bar.style.color = "white";
                    bar.innerHTML = "✅ ក្នុងសាលា! កំពុងបញ្ជូនវត្តមាន...";
                    fetch(WEB_APP_URL, {
                        method: "POST",
                        mode: "no-cors",
                        body: JSON.stringify({ id: name, latitude: pos.coords.latitude, longitude: pos.coords.longitude })
                    }).then(() => {
                        setTimeout(() => {
                            alert("អបអរសាទរ! " + name + " ចុះវត្តមានជោគជ័យ។");
                            location.reload();
                        }, 800);
                    });
                } else {
                    bar.style.background = "#e74c3c";
                    bar.style.color = "white";
                    bar.innerHTML = `❌ អ្នកនៅក្រៅសាលា (${Math.round(dist)}ម)`;
                    setTimeout(() => bar.style.display = "none", 3000);
                }
            }, () => alert("សូមបើក GPS!"));
        }
    }

    function calculateDist(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const p1 = lat1 * Math.PI/180; const p2 = lat2 * Math.PI/180;
        const dp = (lat2-lat1) * Math.PI/180; const dl = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
</script>
</body>
</html>
