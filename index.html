<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធវត្តមានឌីជីថល - សាលាបឋមសិក្សាទួលលៀប</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&family=Moul&display=swap" rel="stylesheet">
    <style>
        :root { --royal: #1a2a6c; --gold: #d4af37; --gold-light: #f1c40f; }
        
        body { 
            font-family: 'Kantumruy Pro', sans-serif; margin: 0;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 95%; max-width: 420px; height: 92vh;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 40px; border: 5px solid var(--gold);
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
        }

        .header { 
            background: var(--royal); padding: 35px 15px; text-align: center; 
            border-bottom: 5px solid var(--gold);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .header h1 { 
            font-family: 'Moul'; font-size: 20px; margin: 0; color: var(--gold-light); 
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }

        /* ផ្នែក Content ដែលមាន Texture ពេជ្រ */
        .content { 
            flex: 1; padding: 25px 15px; overflow-y: auto; 
            background-color: #ffffff;
            background-image: url('https://www.transparenttextures.com/patterns/white-diamond.png');
        }

        /* --- ផ្នែក Card ដែលលោកគ្រូចង់បានឱ្យមានភាពទាក់ទាញ --- */
        .staff-card {
            background: white; border-radius: 20px; padding: 15px; margin-bottom: 18px;
            display: flex; align-items: center; 
            border: 2px solid #e0e0e0;
            border-left: 10px solid var(--royal); /* បន្ថែមកម្រាស់ឆ្នូតចំហៀង */
            box-shadow: 0 8px 15px rgba(0,0,0,0.08);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        /* ចលនាពេល Hover (ដាក់ Mouse លើ) */
        .staff-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--gold);
            box-shadow: 0 15px 30px rgba(212, 175, 55, 0.4);
            background: #fffdf5;
        }

        /* ចលនាពេលចុច (Click/Touch) */
        .staff-card:active {
            transform: scale(0.92);
            transition: 0.1s;
        }

        .avatar {
            width: 65px; height: 65px; border-radius: 18px; 
            background: linear-gradient(45deg, var(--royal), #2a48ad);
            margin-right: 18px; overflow: hidden; display: flex; 
            justify-content: center; align-items: center;
            border: 3px solid var(--gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }

        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar span { color: var(--gold); font-weight: bold; font-size: 24px; }

        .info .name { font-weight: 700; color: var(--royal); font-size: 18px; margin-bottom: 5px; }
        .info .role { 
            font-size: 12px; color: var(--royal); 
            background: #f1f4ff; padding: 4px 12px; 
            border-radius: 15px; border: 1px solid #cdd4ea;
            display: inline-block;
        }

        /* សារបង្ហាញស្ថានភាពបែបទំនើប */
        #status-msg {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            padding: 18px 30px; border-radius: 50px; display: none; z-index: 2000;
            font-weight: bold; text-align: center; border: 3px solid white;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4); min-width: 280px;
        }
    </style>
</head>
<body>

<div id="status-msg"></div>

<div class="app-container">
    <div class="header">
        <h1>សាលាបឋមសិក្សាទួលលៀប</h1>
        <p style="color:white; font-size:11px; margin-top:10px; letter-spacing:3px; font-weight:700;">DIGITAL ATTENDANCE SYSTEM</p>
    </div>
    <div class="content" id="list-container"></div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzUBwkXT5pRfJfmwzi2_nCH7ndOxKYZ153j5A2ftcWCJ78awQu7Zdio8XuKZ7MFiWZE/exec";
    const SCHOOL_GPS = { lat: 12.6988, lon: 103.7499 };

    const staffData = [
        { name: "គុំ សុខាន", role: "នាយក", driveId: "1_f1XQBBK1WpeQPdZRgTLjrGW51TkVEi-" },
        { name: "សូ ធីម", role: "នាយករង", driveId: "" },
        { name: "យ៉ាន សុភ័ក្រ្ត", role: "លេខាធិការ", driveId: "" },
        { name: "សំ ស្រីល័ក្ខណ៍", role: "បណ្ណារក្ស", driveId: "" },
        { name: "មែ រុំ", role: "គ្រូក្រៅប្រព័ន្ធ", driveId: "" },
        { name: "កូយ សៅឃី", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "គុច គួយ", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "ផុន នារតី", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "រស់ ស្រីណា", role: "គ្រូមត្តេយ្យ", driveId: "" },
        { name: "លីវ គីម", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "សាត សៅនឿន", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "សុំ ណារីន", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "ឡូ សេងទ្រី", role: "គ្រូមត្តេយ្យ", driveId: "" },
        { name: "សូសុជាតា", role: "គ្រូកិច្ចសន្យា", driveId: "" },
        { name: "ជឿង សំភស្ស", role: "គ្រូកិច្ចសន្យា", driveId: "" },
        { name: "ឈាវ សុខគុណ", role: "គ្រូកិច្ចសន្យា", driveId: "" },
        { name: "ទ្រី មុនី", role: "គ្រូកិច្ចសន្យា", driveId: "" }
    ];

    const container = document.getElementById('list-container');

    staffData.forEach(s => {
        const card = document.createElement('div');
        card.className = 'staff-card';
        card.onclick = () => startCheckIn(s.name);
        
        const photo = s.driveId 
            ? `<img src="https://lh3.googleusercontent.com/d/${s.driveId}">` 
            : `<span>${s.name.charAt(0)}</span>`;

        card.innerHTML = `
            <div class="avatar">${photo}</div>
            <div class="info">
                <div class="name">${s.name}</div>
                <div class="role">${s.role}</div>
            </div>
        `;
        container.appendChild(card);
    });

    function startCheckIn(userName) {
        const msg = document.getElementById('status-msg');
        msg.style.display = "block";
        msg.style.background = "#fff";
        msg.style.color = "#1a2a6c";
        msg.innerHTML = "⏳ កំពុងពិនិត្យទីតាំង GPS...";

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                const dist = getDistance(pos.coords.latitude, pos.coords.longitude, SCHOOL_GPS.lat, SCHOOL_GPS.lon);
                if (dist <= 500) {
                    msg.style.background = "#27ae60";
                    msg.style.color = "#fff";
                    msg.innerHTML = "✅ ក្នុងសាលា! កំពុងបញ្ជូនទិន្នន័យ...";
                    
                    fetch(WEB_APP_URL, {
                        method: "POST",
                        mode: "no-cors",
                        body: JSON.stringify({ id: userName, latitude: pos.coords.latitude, longitude: pos.coords.longitude })
                    }).then(() => {
                        setTimeout(() => {
                            alert("អបអរសាទរ! " + userName + " ចុះវត្តមានជោគជ័យ។");
                            location.reload();
                        }, 800);
                    });
                } else {
                    msg.style.background = "#e74c3c";
                    msg.style.color = "#fff";
                    msg.innerHTML = `❌ នៅក្រៅសាលា (${Math.round(dist)}ម)`;
                    setTimeout(() => msg.style.display = "none", 4000);
                }
            }, () => alert("សូមបើក GPS លើទូរស័ព្ទ!"));
        }
    }

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const p1 = lat1 * Math.PI/180; const p2 = lat2 * Math.PI/180;
        const dp = (lat2-lat1) * Math.PI/180; const dl = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
</script>
</body>
</html>
