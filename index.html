<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធកត់ត្រាវត្តមានបុគ្គលិក</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Khmer&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Khmer', sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #2c3e50; margin-bottom: 25px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { font-weight: bold; color: #555; }
        select, input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: 'Khmer', sans-serif;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-family: 'Khmer', sans-serif;
            transition: 0.3s;
        }
        .btn-in { background-color: #2ecc71; }
        .btn-in:hover { background-color: #27ae60; }
        .btn-out { background-color: #e74c3c; }
        .btn-out:hover { background-color: #c0392b; }
    </style>
</head>
<body>

<div class="card">
    <h2>កត់ត្រាវត្តមានអនឡាញ</h2>
    
    <div class="form-group">
        <label for="username">ឈ្មោះបុគ្គលិក</label>
        <input type="text" id="username" placeholder="វាយឈ្មោះរបស់លោកគ្រូ/អ្នកគ្រូ">
    </div>

    <div class="form-group">
        <label for="gender">ភេទ</label>
        <select id="gender">
            <option value="ប្រុស">ប្រុស</option>
            <option value="ស្រី">ស្រី</option>
        </select>
    </div>

    <div class="form-group">
        <label for="role">តួនាទី</label>
        <input type="text" id="role" placeholder="ឧ. គ្រូបង្រៀន ឬ នាយករង">
    </div>

    <div class="btn-container">
        <button class="btn-in" onclick="submitAttendance('ចូលវត្តមាន')">ចូលវត្តមាន</button>
        <button class="btn-out" onclick="submitAttendance('ចេញវត្តមាន')">ចេញវត្តមាន</button>
    </div>
</div>

<script>
    // ⚠️ លោកគ្រូគ្រាន់តែយកលីង Web app ថ្មីមកដាក់ជំនួសត្រង់នេះ
    const API_URL = "https://script.google.com/macros/s/AKfycby9pCW889__BiBT8NQchpSj2dXgnayFPpwv6OOvpiRXJDM1OCEBUzbSSE3rZKj9BX8q/exec"; 

    function submitAttendance(attendanceType) {
        const name = document.getElementById("username").value.trim();
        const gender = document.getElementById("gender").value;
        const role = document.getElementById("role").value.trim();

        if (!name || !role) {
            Swal.fire({ icon: 'warning', title: 'មិនទាន់គ្រប់គ្រាន់', text: 'សូមបំពេញឈ្មោះ និងតួនាទីឱ្យបានត្រឹមត្រូវ!' });
            return;
        }

        Swal.fire({
            title: 'កំពុងស្វែងរកទីតាំង...',
            text: 'សូមរង់ចាំមួយភ្លែត',
            allowOutsideClick: false,
            didOpen: () => { Swal.showLoading(); }
        });

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    // រៀបចំកញ្ចប់ទិន្នន័យបញ្ជូន (Payload Keys ត្រូវជាមួយ Apps Script)
                    const payload = {
                        name: name,
                        gender: gender,
                        role: role,
                        type: attendanceType,
                        latitude: pos.coords.latitude,
                        longitude: pos.coords.longitude
                    };

                    fetch(API_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify(payload)
                    })
                    .then(res => res.text())
                    .then(responseText => {
                        Swal.close();
                        
                        if (responseText.includes("Already_Checked_In")) {
                            Swal.fire({ icon: 'warning', title: 'វត្តមានរួចរាល់', text: `លោកគ្រូ/អ្នកគ្រូ ${name} បានចុះឈ្មោះ "ចូលវត្តមាន" រួចរាល់ហើយសម្រាប់ថ្ងៃនេះ!` });
                        } 
                        else if (responseText.includes("Already_Checked_Out")) {
                            Swal.fire({ icon: 'warning', title: 'វត្តមានរួចរាល់', text: `លោកគ្រូ/អ្នកគ្រូ ${name} បានចុះឈ្មោះ "ចេញវត្តមាន" រួចរាល់ហើយសម្រាប់ថ្ងៃនេះ!` });
                        } 
                        else if (responseText.includes("Success_In")) {
                            Swal.fire({ icon: 'success', title: 'ជោគជ័យ', text: `បានកត់ត្រា "ចូលវត្តមាន" សម្រាប់ ${name} រួចរាល់!`, timer: 2500, showConfirmButton: false })
                            .then(() => location.reload());
                        } 
                        else if (responseText.includes("Success_Out") || responseText.includes("Success_Out_Only")) {
                            Swal.fire({ icon: 'success', title: 'ជោគជ័យ', text: `បានកត់ត្រា "ចេញវត្តមាន" សម្រាប់ ${name} រួចរាល់!`, timer: 2500, showConfirmButton: false })
                            .then(() => location.reload());
                        } 
                        else {
                            Swal.fire({ icon: 'error', title: 'បរាជ័យ', text: 'មានបញ្ហាមិនអាចរក្សាទុក៖ ' + responseText });
                        }
                    })
                    .catch(err => {
                        Swal.close();
                        Swal.fire({ icon: 'error', title: 'មានបញ្ហាប្រព័ន្ធ', text: 'មិនអាចទាក់ទងទៅកាន់ Google Sheet បានទេ!' });
                    });
                },
                (err) => {
                    Swal.close();
                    Swal.fire({ icon: 'error', title: 'ទីតាំងត្រូវបានបដិសេធ', text: 'សូមបើក Location/GPS នៅលើទូរសព្ទ ឬកម្មវិធីរុករក (Browser) របស់អ្នកសិន!' });
                }
            );
        } else {
            Swal.fire({ icon: 'error', title: 'មិនគាំទ្រ', text: 'កម្មវិធីរុករកនេះមិនគាំទ្រប្រព័ន្ធរកទីតាំង GPS ឡើយ។' });
        }
    }
</script>

</body>
</html>
