<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធវត្តមានសាលារៀន</title>
    <style>
        body { font-family: 'Khmer OS Battambang', sans-serif; text-align: center; background: #f4f7f9; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        .staff-btn { 
            display: block; width: 100%; padding: 15px; margin: 10px 0; 
            font-size: 18px; border: none; border-radius: 8px; 
            background: #3498db; color: white; cursor: pointer; transition: 0.3s;
        }
        .staff-btn:hover { background: #2980b9; }
        #status { margin-top: 20px; font-weight: bold; color: #e67e22; }
    </style>
</head>
<body>

<div class="container">
    <h2>សូមជ្រើសរើសឈ្មោះរបស់អ្នក</h2>
    <div id="staff-list">
        <button class="staff-btn" onclick="submitAttendance('លោកគ្រូ សូ ធីម')">លោកគ្រូ សូ ធីម</button>
        <button class="staff-btn" onclick="submitAttendance('លោកគ្រូ មែ រុំ')">លោកគ្រូ មែ រុំ</button>
        <button class="staff-btn" onclick="submitAttendance('លោកគ្រូ លីវ គីម')">លោកគ្រូ លីវ គីម</button>
        <button class="staff-btn" onclick="submitAttendance('អ្នកគ្រូ ភត្រា')">អ្នកគ្រូ ភត្រា</button>
        </div>
    <div id="status"></div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzUBwkXT5pRfJfmwzi2_nCH7ndOxKYZ153j5A2ftcWCJ78awQu7Zdio8XuKZ7MFiWZE/exec"; 

    function submitAttendance(staffName) {
        if (!confirm("តើអ្នកពិតជាចង់កត់វត្តមានឈ្មោះ " + staffName + " មែនទេ?")) return;

        document.getElementById('status').innerText = "កំពុងឆែកទីតាំង GPS...";
        
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                
                document.getElementById('status').innerText = "កំពុងផ្ញើទិន្នន័យ...";

                fetch(WEB_APP_URL, {
                    method: "POST",
                    mode: "no-cors",
                    body: JSON.stringify({
                        id: staffName, // ប្រើឈ្មោះជា ID តែម្តង
                        latitude: lat,
                        longitude: lon
                    })
                })
                .then(() => {
                    alert("កត់វត្តមានជោគជ័យសម្រាប់៖ " + staffName);
                    document.getElementById('status').innerText = "រួចរាល់!";
                })
                .catch(err => alert("កំហុស៖ " + err));

            }, (error) => {
                alert("សូមបើក GPS ជាមុនសិន!");
                document.getElementById('status').innerText = "ត្រូវការ GPS ដើម្បីកត់វត្តមាន";
            });
        }
    }
</script>

</body>
</html>
