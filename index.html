<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធវត្តមានឌីជីថល - សាលាបឋមសិក្សាទួលលៀប</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&family=Moul&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0984e3;
            --secondary: #74b9ff;
            --accent: #fdcb6e;
            --bg: #f0f2f5;
            --text: #2d3436;
        }

        body { 
            font-family: 'Kantumruy Pro', sans-serif; 
            margin: 0;
            background: #e0eafc;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            padding: 20px 15px;
        }

        .app-container {
            width: 100%; max-width: 420px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            overflow: hidden;
            display: flex; flex-direction: column;
            height: 85vh;
        }

        .header {
            background: white;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 2px solid var(--bg);
        }

        .header h1 { 
            font-family: 'Moul', cursive; font-size: 18px; margin: 0; 
            color: #d35400; /* ពណ៌ទឹកក្រូចក្រហមបែបប្រពៃណី */
            text-shadow: 1px 1px 0px rgba(0,0,0,0.05);
        }

        .header p { 
            margin: 8px 0 0; font-size: 11px; color: var(--primary); 
            letter-spacing: 2px; font-weight: bold; text-transform: uppercase;
        }

        .content { padding: 20px; flex: 1; overflow-y: auto; }
        
        /* Scrollbar ស្អាត */
        .content::-webkit-scrollbar { width: 5px; }
        .content::-webkit-scrollbar-thumb { background: #dfe6e9; border-radius: 10px; }

        .staff-list { display: flex; flex-direction: column; gap: 12px; }

        .staff-card {
            background: white;
            border: 1px solid #edf2f7;
            border-radius: 22px;
            display: flex; align-items: center;
            padding: 12px 18px;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .staff-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(9, 132, 227, 0.1);
            border-color: var(--secondary);
        }

        .staff-card:active { transform: scale(0.97); }

        .avatar-frame {
            width: 52px; height: 52px; border-radius: 16px;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            display: flex; justify-content: center; align-items: center;
            margin-right: 15px; font-size: 20px; color: white;
            box-shadow: 0 4px 10px rgba(9, 132, 227, 0.2);
            overflow: hidden; flex-shrink: 0;
        }

        .avatar-frame img { width: 100%; height: 100%; object-fit: cover; }

        .info { flex: 1; }
        .name { font-weight: 700; color: var(--text); font-size: 16px; margin-bottom: 2px; }
        .role { 
            font-size: 11px; color: #636e72; 
            background: #f1f2f6;
            padding: 2px 10px; border-radius: 12px; display: inline-block;
        }

        #status {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 85%; padding: 16px; border-radius: 25px;
            backdrop-filter: blur(15px); display: none; text-align: center;
            font-weight: bold; z-index: 100; font-size: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>សាលាបឋមសិក្សាទួលលៀប</h1>
        <p>ប្រព័ន្ធកត់វត្តមានឌីជីថល</p>
    </div>

    <div class="content">
        <div class="staff-list" id="staff-container">
            </div>
    </div>
</div>

<div id="status"></div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzUBwkXT5pRfJfmwzi2_nCH7ndOxKYZ153j5A2ftcWCJ78awQu7Zdio8XuKZ7MFiWZE/exec";
    const SCHOOL_LOC = { lat: 12.698815661413427, lon: 103.74990933657654 };

    const staffData = [
        { name: "គុំ សុខាន", role: "នាយក", driveId: "" },
        { name: "សូ ធីម", role: "នាយករង", driveId: "" },
        { name: "យ៉ាន សុភ័ក្រ្ត", role: "លេខាធិការ", driveId: "" },
        { name: "សំ ស្រីល័ក្ខណ៍", role: "បណ្ណារក្ស", driveId: "" },
        { name: "មែ រុំ", role: "គ្រូក្រៅប្រព័ន្ធ", driveId: "" },
        { name: "កូយ សៅឃី", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "គុច គួយ", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "ផុន នារតី", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "រស់ ស្រីណា", role: "គ្រូមត្តេយ្យ", driveId: "" },
        { name: "លីវ គីម", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "សាត សៅនឿន", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "សុំ ណារីន", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "ឡូ សេងទ្រី", role: "គ្រូមត្តេយ្យ", driveId: "" },
        { name: "សូសុជាតា", role: "គ្រូកិច្ចសន្យា", driveId: "" },
        { name: "ជឿង សំភស្ស", role: "គ្រូកិច្ចសន្យា", driveId: "" },
        { name: "ឈាវ សុខគុណ", role: "គ្រូកិច្ចសន្យា", driveId: "" },
        { name: "ទ្រី មុនី", role: "គ្រូកិច្ចសន្យា", driveId: "" }
    ];

    const container = document.getElementById('staff-container');

    staffData.forEach(staff => {
        const initial = staff.name.split(' ').pop().charAt(0);
        const card = document.createElement('div');
        card.className = 'staff-card';
        card.onclick = () => checkIn(staff.name);
        
        const photoContent = staff.driveId 
            ? `<img src="http://googleusercontent.com/profile/picture/5{staff.driveId}">` 
            : `<span>${initial}</span>`;

        card.innerHTML = `
            <div class="avatar-frame">${photoContent}</div>
            <div class="info">
                <div class="name">${staff.name}</div>
                <div class="role">${staff.role}</div>
            </div>
        `;
        container.appendChild(card);
    });

    function checkIn(name) {
        const area = document.getElementById('status');
        area.style.display = "block";
        area.style.background = "white";
        area.style.color = "#2d3436";
        area.innerHTML = "⏳ កំពុងផ្ទៀងផ្ទាត់ទីតាំង...";

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                const dist = getDistance(pos.coords.latitude, pos.coords.longitude, SCHOOL_LOC.lat, SCHOOL_LOC.lon);
                if (dist <= 100) {
                    area.style.background = "#00b894";
                    area.style.color = "white";
                    area.innerHTML = "🚀 ទីតាំងត្រឹមត្រូវ! កំពុងបញ្ជូនវត្តមាន...";
                    saveToSheets(name, pos.coords.latitude, pos.coords.longitude);
                } else {
                    area.style.background = "#d63031";
                    area.style.color = "white";
                    area.innerHTML = `❌ អ្នកនៅឆ្ងាយពីសាលា (${Math.round(dist)}ម)`;
                }
            }, () => alert("សូមបើក GPS!"), { enableHighAccuracy: true });
        }
    }

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const p1 = lat1 * Math.PI/180; const p2 = lat2 * Math.PI/180;
        const dp = (lat2-lat1) * Math.PI/180; const dl = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function saveToSheets(name, lat, lon) {
        fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ id: name, latitude: lat, longitude: lon }) })
        .then(() => {
            alert("✅ ចុះវត្តមានរួចរាល់៖ " + name);
            location.reload();
        });
    }
</script>
</body>
</html>
