<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធវត្តមានឌីជីថល - សាលាបឋមសិក្សាទួលលៀប</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&family=Moul&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --sky-blue: #00a8ff;
            --deep-sky: #0097e6;
            --soft-sky: #e1f5fe;
            --professional-blue: #1e3799;
            --gold-accent: #f1c40f;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Kantumruy Pro', sans-serif; margin: 0;
            background: #87CEEB;
            background: linear-gradient(135deg, #87CEEB 0%, #E0F7FA 100%);
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow: hidden; position: relative;
        }

        /* --- បន្ថែម៖ ចលនាគ្រាប់ពេជ្រអណ្តែត (Diamond Animation) --- */
        #diamond-container {
            position: absolute; width: 100%; height: 100%;
            top: 0; left: 0; z-index: 0; pointer-events: none;
        }

        .diamond-particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            animation: diamondMove 15s infinite linear;
            opacity: 0;
        }

        @keyframes diamondMove {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* ចលនាពពកអណ្តែតនៅ Background */
        body::before, body::after {
            content: ""; position: absolute; border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            filter: blur(50px); z-index: 0;
            animation: float 20s infinite alternate ease-in-out;
        }
        body::before { width: 300px; height: 300px; top: -10%; left: -10%; }
        body::after { width: 250px; height: 250px; bottom: -5%; right: -5%; animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 100px) scale(1.2); }
        }

        .app-container {
            width: 95%; max-width: 400px; height: 90vh;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px); border-radius: 40px;
            border: 4px solid white; display: flex; flex-direction: column;
            box-shadow: 0 25px 50px rgba(0, 168, 255, 0.2);
            overflow: hidden; position: relative; z-index: 1;
        }

        .header { 
            background: var(--deep-sky); padding: 25px 15px; text-align: center;
            border-bottom: 4px solid var(--gold-accent); box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .header h1 { font-family: 'Moul', cursive; font-size: 18px; margin: 0; color: #fff; }
        .header p { color: rgba(255,255,255,0.9); font-size: 10px; margin-top: 8px; letter-spacing: 2px; font-weight: bold; }

        .content { 
            flex: 1; padding: 20px 15px; overflow-y: auto; 
            background-image: url('https://www.transparenttextures.com/patterns/white-diamond.png');
        }

        .content::-webkit-scrollbar { width: 0px; }

        /* Card បុគ្គលិក បែបខៀវស្រាល និងតូចសមសួន */
        .staff-card {
            background: white; border-radius: 15px; padding: 10px 15px; margin-bottom: 12px;
            display: flex; align-items: center;
            border: 1.5px solid var(--soft-sky);
            border-left: 6px solid var(--professional-blue);
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            cursor: pointer; opacity: 0; transform: translateY(20px);
            animation: slideUp 0.6s ease forwards;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        .staff-card:hover {
            transform: scale(1.03) translateX(5px);
            border-color: var(--sky-blue);
            box-shadow: 0 10px 20px rgba(0, 168, 255, 0.15);
            background: #f0fbff;
        }

        .staff-card:active { transform: scale(0.95); }

        .avatar {
            width: 50px; height: 50px; border-radius: 12px; background: var(--soft-sky);
            margin-right: 15px; overflow: hidden; display: flex; 
            justify-content: center; align-items: center;
            border: 1.5px solid var(--sky-blue); flex-shrink: 0;
        }

        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar span { color: var(--professional-blue); font-weight: bold; font-size: 20px; }

        .info .name { font-weight: 700; color: #2d3436; font-size: 16px; margin-bottom: 2px; }
        .info .role { 
            font-size: 10px; color: var(--professional-blue); 
            background: rgba(30, 55, 153, 0.08); padding: 2px 10px; 
            border-radius: 10px; font-weight: 600;
        }

        #status-bar {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 80%; padding: 15px; border-radius: 25px; display: none;
            text-align: center; font-weight: bold; z-index: 1000;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2); animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
            100% { transform: translateX(-50%) scale(1); }
        }
    </style>
</head>
<body>

<div id="diamond-container"></div>

<div id="status-bar"></div>

<div class="app-container">
    <div class="header">
        <h1>សាលាបឋមសិក្សាទួលលៀប</h1>
        <p>SMART ATTENDANCE • SKY EDITION</p>
    </div>
    <div class="content" id="list"></div>
</div>

<script>
    // --- បន្ថែម៖ Function បង្កើតគ្រាប់ពេជ្រអណ្តែត ---
    function createDiamonds() {
        const container = document.getElementById('diamond-container');
        for (let i = 0; i < 25; i++) {
            const diamond = document.createElement('div');
            diamond.className = 'diamond-particle';
            const size = Math.random() * 15 + 5;
            diamond.style.width = `${size}px`;
            diamond.style.height = `${size}px`;
            diamond.style.left = `${Math.random() * 100}vw`;
            diamond.style.animationDelay = `${Math.random() * 15}s`;
            diamond.style.animationDuration = `${Math.random() * 10 + 10}s`;
            container.appendChild(diamond);
        }
    }
    createDiamonds(); // ហៅមកប្រើ

    // Link ទៅកាន់ Google Script លោកគ្រូ
    const API_URL = "https://script.google.com/macros/s/AKfycbzUBwkXT5pRfJfmwzi2_nCH7ndOxKYZ153j5A2ftcWCJ78awQu7Zdio8XuKZ7MFiWZE/exec";
    const SCHOOL_LOC = { lat: 12.6988, lon: 103.7499 };

    const staffData = [
        { name: "គុំ សុខាន", role: "នាយក", driveId: "1_f1XQBBK1WpeQPdZRgTLjrGW51TkVEi-" },
        { name: "សូ ធីម", role: "នាយករង", driveId: "1Ss4TqvmE-yCEeJ9somBj0nhwq4zmhn6s" },
        { name: "យ៉ាន សុភ័ក្រ្ត", role: "លេខាធិការ", driveId: "10HMqBSsPXY9oI-dUpOFooAGgZo7Km3CX" },
        { name: "សំ ស្រីល័ក្ខណ៍", role: "បណ្ណារក្ស", driveId: "1Ab3662TvWv15emb4-Z3gD2zxPVHykhRb" },
        { name: "មែ រុំ", role: "គ្រូក្រៅប្រព័ន្ធ", driveId: "1AdH-0CoI2Sl6MN4rlZ5zogpzr3aDuL3A" },
        { name: "កូយ សៅឃី", role: "គ្រូឈរថ្នាក់", driveId: "1JEgGF3XtxqD8bHyMZAmkM4FJyk4HoLwW" },
        { name: "គុច គួយ", role: "គ្រូឈរថ្នាក់", driveId: "10_WcjHyGON1c5FFeonlnp1Y6cjKuwwB9" },
        { name: "ផុន នារតី", role: "គ្រូឈរថ្នាក់", driveId: "1siyfigfJcXczcUldJSCpBs4OiOXU5yDP" },
        { name: "រស់ ស្រីណា", role: "គ្រូមត្តេយ្យ", driveId: "1jf2NFrPZzZ00SKhpH2wkPPR0Pu8_azL2" },
        { name: "លីវ គីម", role: "គ្រូឈរថ្នាក់", driveId: "14nvjOJJhGUeGkA7JzAO_HZKNhdah_aAV" },
        { name: "សាត សៅនឿន", role: "គ្រូឈរថ្នាក់", driveId: "1SFoOAZ-jxtr8qM457luoV5b5LHADJIzm" },
        { name: "សុំ ណារីន", role: "គ្រូឈរថ្នាក់", driveId: "1DlBQdVQZHuss77h2eSsSxI5vYT227OkU" },
        { name: "ឡូ សេងទ្រី", role: "គ្រូមត្តេយ្យ", driveId: "1xb4bd4-FcwdbLYRdXn9uNHF1z7oXONw6" },
        { name: "សូ សុជាតា", role: "គ្រូកិច្ចសន្យា", driveId: "1P9Zg37vnZN0kWgT0aJJ_IX4e9JBBG-oD" },
        { name: "ជឿង សំភស្ស", role: "គ្រូកិច្ចសន្យា", driveId: "1DtRmEj-_1781egLfo-kWGRie-tfNHstz" },
        { name: "ឈាវ សុខគុណ", role: "គ្រូកិច្ចសន្យា", driveId: "1FwperxCTCmxn6i5oH3ShiDw8UhMeyic_" },
        { name: "ទ្រី មុនី", role: "គ្រូកិច្ចសន្យា", driveId: "1rb25ikHlFFDPJ7X92QynSXJyhMu4v6qd" }
    ];

    const listDiv = document.getElementById('list');

    staffData.forEach((s, i) => {
        const card = document.createElement('div');
        card.className = 'staff-card';
        card.style.animationDelay = `${i * 0.08}s`;
        card.onclick = () => submitAttendance(s.name);
        
        const photo = s.driveId 
            ? `<img src="https://lh3.googleusercontent.com/d/${s.driveId}">` 
            : `<span>${s.name.charAt(0)}</span>`;

        card.innerHTML = `
            <div class="avatar">${photo}</div>
            <div class="info">
                <div class="name">${s.name}</div>
                <div class="role">${s.role}</div>
            </div>
        `;
        listDiv.appendChild(card);
    });

    function submitAttendance(name) {
        const bar = document.getElementById('status-bar');
        bar.style.display = "block";
        bar.style.background = "white";
        bar.style.color = "#333";
        bar.innerHTML = "⏳ កំពុងផ្ទៀងផ្ទាត់ទីតាំង...";

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                const d = getDist(pos.coords.latitude, pos.coords.longitude, SCHOOL_LOC.lat, SCHOOL_LOC.lon);
                if (d <= 300) {
                    bar.style.background = "#27ae60";
                    bar.style.color = "white";
                    bar.innerHTML = "✅ ទីតាំងត្រឹមត្រូវ! កំពុងរក្សាទុក...";
                    fetch(API_URL, {
                        method: "POST",
                        mode: "no-cors",
                        body: JSON.stringify({ id: name, latitude: pos.coords.latitude, longitude: pos.coords.longitude })
                    }).then(() => {
                        setTimeout(() => {
                            alert("✅ ជោគជ័យ! " + name + " បានចុះវត្តមានរួចរាល់។");
                            location.reload();
                        }, 500);
                    });
                } else {
                    bar.style.background = "#e74c3c";
                    bar.style.color = "white";
                    bar.innerHTML = `❌ នៅឆ្ងាយពេក (${Math.round(d)}ម)`;
                    setTimeout(() => bar.style.display = "none", 4000);
                }
            }, () => alert("សូមបើក GPS!"));
        }
    }

    function getDist(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const p1 = lat1 * Math.PI/180; const p2 = lat2 * Math.PI/180;
        const dp = (lat2-lat1) * Math.PI/180; const dl = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
</script>
</body>
</html>
