<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធវត្តមានឌីជីថល - សាលាបឋមសិក្សាទួលលៀប</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&family=Moul&display=swap" rel="stylesheet">
    <style>
        :root { --royal: #1a2a6c; --gold: #d4af37; --gold-gradient: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c); }
        
        body { 
            font-family: 'Kantumruy Pro', sans-serif; margin: 0;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
        }

        .app-container {
            width: 95%; max-width: 420px; height: 92vh; background: #fff;
            border-radius: 40px; border: 6px solid var(--gold);
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5); position: relative;
        }

        .header { 
            background: var(--royal); padding: 30px 15px; text-align: center; 
            border-bottom: 5px solid var(--gold); position: relative;
        }

        .header h1 { font-family: 'Moul'; font-size: 19px; margin: 0; color: #f1c40f; text-shadow: 2px 2px 4px rgba(0,0,0,0.4); }
        .header p { color: white; font-size: 10px; margin-top: 8px; letter-spacing: 2px; font-weight: bold; }

        .content { 
            flex: 1; padding: 20px 15px; overflow-y: auto; 
            background-color: #ffffff;
            background-image: url('https://www.transparenttextures.com/patterns/white-diamond.png'); /* Texture ពេជ្រ */
        }

        /* --- បន្ថែមចលនា និងស៊ុមឱ្យ Card --- */
        .staff-card {
            background: white; border-radius: 20px; padding: 15px; margin-bottom: 18px;
            display: flex; align-items: center; 
            border: 2.5px solid transparent;
            background-image: linear-gradient(white, white), var(--gold-gradient);
            background-origin: border-box;
            background-clip: content-box, border-box;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        /* ចលនាពេលយកដៃប៉ះ (Touch) ឬ Hover */
        .staff-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 15px 30px rgba(212, 175, 55, 0.4);
        }

        .staff-card:active { transform: scale(0.94); }

        .avatar {
            width: 65px; height: 65px; border-radius: 18px; background: var(--royal);
            margin-right: 18px; overflow: hidden; display: flex; 
            justify-content: center; align-items: center;
            border: 3px solid var(--gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar span { color: var(--gold); font-weight: bold; font-size: 24px; }

        .info .name { font-weight: 700; color: var(--royal); font-size: 17px; margin-bottom: 5px; }
        .info .role { font-size: 11px; color: #555; background: #f0f2f8; padding: 3px 12px; border-radius: 12px; border: 1px solid #d1d9e6; }

        #status-alert {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            padding: 15px 30px; border-radius: 50px; display: none; z-index: 2000;
            font-weight: bold; text-align: center; color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 2px solid white;
        }
    </style>
</head>
<body>

<div id="status-alert"></div>

<div class="app-container">
    <div class="header">
        <h1>សាលាបឋមសិក្សាទួលលៀប</h1>
        <p>DIGITAL ATTENDANCE SYSTEM</p>
    </div>
    <div class="content" id="list-container"></div>
</div>

<script>
    const SHEET_API = "https://script.google.com/macros/s/AKfycbzUBwkXT5pRfJfmwzi2_nCH7ndOxKYZ153j5A2ftcWCJ78awQu7Zdio8XuKZ7MFiWZE/exec";
    const SCHOOL_GPS = { lat: 12.6988, lon: 103.7499 };

    const staffData = [
        { name: "គុំ សុខាន", role: "នាយក", driveId: "1_f1XQBBK1WpeQPdZRgTLjrGW51TkVEi-" },
        { name: "សូ ធីម", role: "នាយករង", driveId: "" },
        { name: "យ៉ាន សុភ័ក្រ្ត", role: "លេខាធិការ", driveId: "" },
        { name: "សំ ស្រីល័ក្ខណ៍", role: "បណ្ណារក្ស", driveId: "" },
        { name: "មែ រុំ", role: "គ្រូក្រៅប្រព័ន្ធ", driveId: "" },
        { name: "កូយ សៅឃី", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "គុច គួយ", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "ផុន នារតី", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "រស់ ស្រីណា", role: "គ្រូមត្តេយ្យ", driveId: "" },
        { name: "លីវ គីម", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "សាត សៅនឿន", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "សុំ ណារីន", role: "គ្រូឈរថ្នាក់", driveId: "" },
        { name: "ឡូ សេងទ្រី", role: "គ្រូមត្តេយ្យ", driveId: "" },
        { name: "សូសុជាតា", role: "គ្រូកិច្ចសន្យា", driveId: "" },
        { name: "ជឿង សំភស្ស", role: "គ្រូកិច្ចសន្យា", driveId: "" },
        { name: "ឈាវ សុខគុណ", role: "គ្រូកិច្ចសន្យា", driveId: "" },
        { name: "ទ្រី មុនី", role: "គ្រូកិច្ចសន្យា", driveId: "" }
    ];

    const container = document.getElementById('list-container');

    staffData.forEach(s => {
        const card = document.createElement('div');
        card.className = 'staff-card';
        card.onclick = () => processAttendance(s.name);
        
        const avatarHtml = s.driveId 
            ? `<img src="https://lh3.googleusercontent.com/d/${s.driveId}">` 
            : `<span>${s.name.charAt(0)}</span>`;

        card.innerHTML = `
            <div class="avatar">${avatarHtml}</div>
            <div class="info">
                <div class="name">${s.name}</div>
                <div class="role">${s.role}</div>
            </div>
        `;
        container.appendChild(card);
    });

    function processAttendance(name) {
        const alertBox = document.getElementById('status-alert');
        alertBox.style.display = "block";
        alertBox.style.background = "#34495e";
        alertBox.innerHTML = "⏳ កំពុងផ្ទៀងផ្ទាត់ទីតាំង...";

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                const distance = getDist(pos.coords.latitude, pos.coords.longitude, SCHOOL_GPS.lat, SCHOOL_GPS.lon);
                if (distance <= 500) {
                    alertBox.style.background = "#27ae60";
                    alertBox.innerHTML = "✅ ទីតាំងត្រឹមត្រូវ! កំពុងបញ្ជូន...";
                    fetch(SHEET_API, {
                        method: "POST",
                        mode: "no-cors",
                        body: JSON.stringify({ id: name, latitude: pos.coords.latitude, longitude: pos.coords.longitude })
                    }).then(() => {
                        setTimeout(() => {
                            alert("អបអរសាទរ! " + name + " ចុះវត្តមានជោគជ័យ។");
                            location.reload();
                        }, 800);
                    });
                } else {
                    alertBox.style.background = "#e74c3c";
                    alertBox.innerHTML = `❌ នៅក្រៅសាលា (${Math.round(distance)}ម)`;
                    setTimeout(() => alertBox.style.display = "none", 3000);
                }
            }, () => alert("សូមបើក GPS!"));
        }
    }

    function getDist(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const p1 = lat1 * Math.PI/180; const p2 = lat2 * Math.PI/180;
        const dp = (lat2-lat1) * Math.PI/180; const dl = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
</script>
</body>
</html>
