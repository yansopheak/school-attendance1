<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចុះវត្តមានបុគ្គលិក</title>
    <style>
        body { font-family: 'Khmer OS Battambang', sans-serif; text-align: center; padding-top: 50px; background: #f0f2f5; }
        .loader { border: 8px solid #f3f3f3; border-top: 8px solid #3498db; border-radius: 50%; width: 50px; height: 50px; animation: spin 2s linear infinite; margin: auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status { margin-top: 20px; font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>

    <div id="main-ui">
        <div class="loader"></div>
        <div class="status" id="msg">កំពុងផ្ទៀងផ្ទាត់ទីតាំង និងកត់វត្តមាន...</div>
    </div>

    <script>
        const WEB_APP_URL = "ដាក់_WEB_APP_URL_របស់អ្នក_នៅទីនេះ"; 

        // ចាប់យក ID ពីតំណ Link (ឧទាហរណ៍៖ ?id=T001)
        const urlParams = new URLSearchParams(window.location.search);
        const staffId = urlParams.get('id');

        if (!staffId) {
            document.getElementById('msg').innerHTML = "<span style='color:red;'>កំហុស៖ រកមិនឃើញអត្តលេខបុគ្គលិក!</span>";
        } else {
            checkLocationAndSubmit();
        }

        function checkLocationAndSubmit() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        submitData(staffId, lat, lon);
                    },
                    (error) => {
                        alert("សូមបើក GPS ជាមុនសិន ទើបអាចចុះវត្តមានបាន!");
                        document.getElementById('msg').innerText = "សូមបើក GPS រួចព្យាយាមម្តងទៀត";
                    },
                    { enableHighAccuracy: true }
                );
            }
        }

        function submitData(id, lat, lon) {
            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({ id: id, latitude: lat, longitude: lon })
            })
            .then(() => {
                document.getElementById('main-ui').innerHTML = `
                    <h2 style="color:green;">✔️ កត់វត្តមានជោគជ័យ</h2>
                    <p>អត្តលេខ៖ ${id}</p>
                    <p>ម៉ោង៖ ${new Date().toLocaleTimeString()}</p>
                `;
            })
            .catch(err => alert("មានបញ្ហា៖ " + err));
        }
    </script>
</body>
</html>
